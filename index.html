slové zásuvky 400 V a s adaptérem i z běžné 230 V. Chránič typu B a hlídání teploty má přímo v jednotce.","aside":"Výkon 11 nebo 22 kW, kabel 6,5 nebo 10 m. Wi-Fi, LTE, měření MID a funkce pro FVE vyberete na detailu.","products":["maveiro-pro-ii","maveiro-ii","maveiro-lite"],"filter_label":"Výkon","filters":[{"key":"11","label":"11 kW"},{"key":"22","label":"22 kW"}],"compare":{"h2":"Srovnání řad","p":"Elektronika, ochrany i aplikace jsou ve všech řadách stejné. Liší se zásuvky, které obslouží, a co je v balení.","cols":["maveiro-pro-ii","maveiro-ii","maveiro-lite"],"rows":[["Zásuvky","Výměnné adaptéry: 230 V, CEE 16 A a 32 A, kemp, Typ 2","Pevná vidlice CEE 5p, 16 A nebo 32 A","[[Výměnné adaptéry, potvrdí výrobce]]"],["Výkon","11 nebo 22 kW","11 nebo 22 kW","11 kW"],["Adaptéry v balení","Podle sady: žádný, dva, nebo čtyři","Nejsou potřeba","[[Upřesní výrobce]]"],["Připojení","Bluetooth, za příplatek Wi-Fi a LTE","Bluetooth, za příplatek Wi-Fi a LTE","Offline, funkce v aplikaci"],["Nabíjení z FVE","S Wi-Fi a funkcemi pro FVE","S Wi-Fi a funkcemi pro FVE","[[Doplněk v aplikaci, potřebuje Wi-Fi]]"],["Měření MID","Za příplatek","Za příplatek","[[Upřesní výrobce]]"],["Typické použití","Doma, na chatě, na cestách i u veřejné stanice","Doma v garáži se zásuvkou CEE","Doma, funkce podle potřeby"]]},"help":{"h":"Řadu vám doporučí technik","p":"Napište model elektromobilu a zásuvky, které máte doma i na cestách. Technik doporučí konkrétní sestavu.","cta":"Napsat technikovi"},"seo":{"h2":"Přenosný wallbox a nabíjecí kabel z výbavy elektromobilu","p":["Nabíjecí kabel, který dodávají automobilky, nabíjí z běžné zásuvky pomalu a bez aplikace. Přenosný wallbox nabíjí až 22 kW, hlídá zásuvku i proud na fázích a ovládáte ho z telefonu.","Většina elektromobilů nabíjí střídavě nejvýš 11 kW, doma proto obvykle stačí verze 11 kW a zásuvka CEE 16 A. Když nabíjíte i jinde, vyberte PRO II s výměnnými adaptéry."]},"faq":["f-pro-vs-ii","f-11-22","f-230","f-typ2"]},{"handle":"nastenne-wallboxy","name":"Nástěnné wallboxy","lead":"Wallbox pro místo, kde parkujete každý den. Měření s certifikátem MID a RFID čtečka v ceně. S funkcemi pro FVE nabíjí z přebytků, se střídači Solax G4 a GoodWe řady ET i podle stavu domácí baterie.","aside":"Montáž dělá elektrikář, v Polsku ji nenabízíme. Montážní firmu vám doporučíme.","products":["maveiro-wallbox"],"help":{"h":"Montážní firmu doporučíme","p":"Instalaci dělá elektrikář. Napište nám vojvodství a doporučíme montážní firmu [[ze sítě partnerů, kterou výrobce v Polsku teprve buduje]].","cta":"Napsat technikovi"},"seo":{"h2":"Nástěnný wallbox s fotovoltaikou","p":["Nástěnný wallbox se připojí ke střídači Solax G4 nebo GoodWe řady ET přímo, k ostatním přes elektroměr Shelly. S funkcemi pro FVE nabíjí z přebytků, hlídá hlavní jistič a s funkcí Offgrid nevybije domácí baterii pod nastavené minimum."]},"faq":["f-install","f-offgrid","f-fve-need"]},{"handle":"prislusenstvi","name":"Příslušenství","lead":"Adaptéry pro další zásuvky, kabely, držáky a tašky. U každého produktu je vidět, ke které řadě pasuje.","products":["adapter-cee-5p-16","adapter-cee-5p-32","adapter-cee-3p-16","adapter-230","adapter-typ2-11","adapter-typ2-22","shelly-pro-3em","prodluzovaci","kabel-typ2-11","smart-fix","zamek","drzak","drzak-konektoru","kufrik","taska"],"dense":true,"filter_label":"Pasuje k","filters":[{"key":"pro2","label":"Maveiro PRO II"},{"key":"ii","label":"Maveiro II"},{"key":"wallbox","label":"Maveiro Wallbox"}]}],"faq":[{"id":"f-pro-vs-ii","topics":["vyber"],"q":"Jaký je rozdíl mezi Maveiro PRO II a Maveiro II?","a":["PRO II má na konci kabelu výměnné adaptéry. Zapojíte ho do běžné zásuvky 230 V, do průmyslové zásuvky CEE i do veřejné stanice s adaptérem Typ 2.","Maveiro II má pevnou vidlici CEE 5p, 16 A u verze 11 kW a 32 A u verze 22 kW. Hodí se tam, kde nabíjíte stále z jedné zásuvky CEE. Elektronika, ochrany i aplikace jsou stejné."],"src":"Obsah balení a parametry, parametry na českém e-shopu výrobce, 31. 10. 2026"},{"id":"f-11-22","topics":["vyber"],"q":"Stačí mi 11 kW, nebo potřebuji 22 kW?","a":["Rozhoduje palubní nabíječka elektromobilu. Většina elektromobilů nabíjí střídavým proudem nejvýš 11 kW, 22 kW využijí jen modely s palubní nabíječkou 22 kW. Plných 22 kW dá jen zásuvka CEE 32 A, s adaptérem 16 A nabíjí verze 22 kW na 11 kW.","Napište nám model elektromobilu a zásuvku, kterou máte. Odpovíme konkrétně."],"src":"Odborná odpověď, formulaci potvrdí klient"},{"id":"f-230","topics":["zapojeni"],"q":"Můžu nabíjet z běžné zásuvky 230 V?","a":["Ano, s adaptérem 230 V. U PRO II je v sadách Basic a Plus, k sadě Charger ho dokoupíte.","Z běžné zásuvky nabíjíte pomaleji. [[Maximální proud adaptéru 230 V doplní výrobce.]] Wallbox přitom hlídá teplotu a při zahřátí proud sníží."],"src":"Obsah sad a popis adaptéru 230 V, parametry na českém e-shopu výrobce"},{"id":"f-safe","topics":["zapojeni"],"q":"Je bezpečné nabíjet ze zásuvky, kterou neznám?","a":["Chránič typu B (30 mA AC a 6 mA DC) je přímo v jednotce a před každým nabíjením se sám otestuje. Wallbox kontroluje zapojení vodičů a hlídá teplotu ve vidlici, podle normy IEC 62752:2024.","Když se vidlice nebo zásuvka zahřeje, wallbox sníží proud. Nemusíte znát stav elektroinstalace na chatě ani v kempu."],"src":"Návod k přenosnému wallboxu v1.5; formulace normy podle klienta, 7. 10. 2026"},{"id":"f-typ2","topics":["zapojeni","vyber"],"q":"Můžu PRO II použít na veřejné nabíjecí stanici?","a":["Ano. S adaptérem Typ 2 (11 kW nebo 22 kW) z něj uděláte nabíjecí kabel pro veřejné stanice a wallboxy se zásuvkou Typ 2. Samostatný kabel pak s sebou vozit nemusíte."],"src":"Popis adaptéru Typ 2 (funkce FlexMode), parametry na českém e-shopu výrobce"},{"id":"f-noapp","topics":["aplikace"],"q":"Funguje wallbox i bez aplikace?","a":["Ano. Po zapojení začne nabíjet sám a proud nastavíte přímo na jednotce. Aplikace EV-Manager přidá historii nabíjení, plánování a nabíjení z FVE."],"src":"Popis produktu (Plug & Charge) a recenze zákazníků, parametry na českém e-shopu výrobce"},{"id":"f-fve-need","topics":["aplikace","fve"],"q":"Co potřebuji k nabíjení z přebytků FVE?","a":["Wallbox s Wi-Fi ve stejné místní síti jako střídač nebo elektroměr a aktivované funkce pro FVE.","Střídače Solax G4 a GoodWe řady ET wallbox čte přímo přes Modbus TCP. U ostatních značek (Huawei, SMA, Fronius, Solis, Victron, Deye) potřebujete elektroměr Shelly 3EM nebo Shelly Pro 3EM."],"src":"FAQ zákaznického portálu výrobce, 31. 10. 2026"},{"id":"f-lte","topics":["aplikace","fve"],"q":"Funguje nabíjení z FVE přes LTE?","a":["Ne. Wallbox se se střídačem domlouvá v místní síti, proto potřebuje Wi-Fi (nástěnný wallbox i Ethernet). Přes LTE funguje ovládání z aplikace a OCPP. Když máte verzi jen s Bluetooth, Wi-Fi dokoupíte."],"src":"FAQ zákaznického portálu výrobce"},{"id":"f-modes","topics":["aplikace","fve"],"q":"Jaké jsou režimy nabíjení z FVE?","a":["Off nabíjí zvoleným proudem bez ohledu na slunce. Eco bere přebytek a ze sítě doplní nejvýš 3 A. Eco+ nabíjí jen z přebytku: začne od 6 A, a když slunce ubude, počká. Mezi režimy přepínáte v aplikaci."],"src":"zákaznický portál výrobce"},{"id":"f-chargesafe","topics":["aplikace","fve"],"q":"Co dělá ChargeSafe?","a":["Hlídá hlavní jistič. Když doma zapnete bojler, troubu nebo tepelné čerpadlo, ChargeSafe sníží nabíjecí proud tak, aby jistič nevypadl. Na rozdíl od pevného limitu v aplikaci se řídí skutečnou spotřebou domu."],"src":"zákaznický portál výrobce"},{"id":"f-onetime","topics":["aplikace","fve"],"q":"Platí se funkce pro FVE měsíčně?","a":["Ne. SolarSync, ChargeSafe a Offgrid zaplatíte jednou a fungují trvale, včetně budoucích aktualizací. Dokoupit je můžete i později v aplikaci, aktivují se hned po zaplacení."],"src":"FAQ zákaznického portálu; u Maveiro Lite se model funkcí liší, upřesní výrobce"},{"id":"f-mid","topics":["vyber"],"q":"K čemu je měření MID?","a":["Základní měření má každý wallbox. Měření s certifikátem MID stačí na rozúčtování nabíjení, třeba když nabíjíte služební elektromobil doma a firma vám elektřinu proplácí. Úředně ověřené stanovené měřidlo to není."],"src":"Popis příplatku Měření, parametry na českém e-shopu výrobce"},{"id":"f-tesla","topics":["vyber"],"q":"Co dělá Tesla tlačítko?","a":["Tlačítko na koncovce otevře nabíjecí port Tesly, nebo odemkne konektor, když jste u Tesly s klíčem. Nepotřebuje baterii."],"src":"Popis příplatku Tesla tlačítko, parametry na českém e-shopu výrobce"},{"id":"f-integrations","topics":["aplikace"],"q":"Dá se wallbox napojit na Home Assistant nebo Loxone?","a":["Na Home Assistant ho napojíte přes lokální API, postup je ve videu [[polská verze]]. Pro Loxone je ke stažení šablona přes Modbus TCP. Nadřazený systém může řídit proud, spouštět a ukončovat nabíjení a přepínat jednu a tři fáze. Dál wallbox spolupracuje se SundayGate, Solar-Station, Solarmanager a Clever-PV."],"src":"Návod v1.5 a zákaznický portál výrobce"},{"id":"f-install","topics":["zapojeni"],"q":"Kdo mi nainstaluje nástěnný wallbox?","a":["Montáž dělá elektrikář. V Polsku ji nenabízíme. Napište nám vojvodství a doporučíme montážní firmu. Montážní materiál není v balení."],"src":"Zadávací dokumentace kap. 3.1.4; návod k montáži"},{"id":"f-offgrid","topics":["fve"],"q":"Nabíjí nástěnný wallbox z FVE, i když mám zakázané přetoky?","a":["Ano. Funkce Offgrid řídí nabíjení podle nabití domácí baterie: nastavíte minimum a wallbox baterii pod něj nevybije. Funguje se střídači Solax G4 a GoodWe řady ET s připojenou baterií."],"src":"zákaznický portál výrobce"},{"id":"f-warranty","topics":["objednavka"],"q":"Jaká je záruka?","a":["Na wallbox máte zákonnou záruku 2 roky. Reklamaci vyřídíte přes formulář nebo u podpory, posíláme ji do servisu v Česku. [[Případnou delší záruku výrobce pro Polsko potvrdí klient.]]"],"src":"Parametry produktu (záruka 2 roky), parametry na českém e-shopu výrobce"},{"id":"f-ship","topics":["objednavka"],"q":"Odkud zboží posíláte a jak dlouho jde?","a":["Posíláme ze skladu v Česku. [[Expedice do X pracovních dnů, doručení v Polsku obvykle za X dny.]]"],"src":"Zadávací dokumentace kap. 3.2.2, časy doplní klient"},{"id":"f-pay","topics":["objednavka"],"q":"Jak můžu zaplatit?","a":["BLIKem, rychlým převodem přes Przelewy24, kartou, přes Apple Pay a Google Pay, bankovním převodem nebo na dobírku. [[Při platbě převodem sleva X zł, poplatek za dobírku X zł.]]"],"src":"Zadávací dokumentace kap. 3.2.1, doplněno o BLIK a Przelewy24 (Gemius 2026)"},{"id":"f-return","topics":["objednavka"],"q":"Můžu wallbox vrátit?","a":["Ano, do 14 dnů od převzetí bez udání důvodu. Odstoupení vyplníte online formulářem, adresu pro vrácení pošleme e-mailem. [[Výjimky pro individuálně konfigurované zařízení a aktivované funkce určí obchodní podmínky.]]"],"src":"Zákon o právech spotřebitele, 14 dní"},{"id":"f-partner","topics":["partneri"],"q":"Pro koho je partnerství?","a":["Pro elektromontážní firmy, montážníky FVE a prodejce v Polsku. [[Podmínky spolupráce upřesní výrobce.]]"],"src":"Zadávací dokumentace kap. 3.1.4"},{"id":"f-shelly","topics":["fve"],"q":"Musím si Shelly koupit zvlášť?","a":["Se střídačem Solax G4 nebo GoodWe řady ET ne. U ostatních značek potřebujete elektroměr Shelly 3EM nebo Shelly Pro 3EM [[v nabídce obchodu, potvrdí klient]]. Do rozvaděče ho osadí elektrikář."],"src":"FAQ zákaznického portálu výrobce"}],"notes":{"svc":{"t":"Servisní lišta","d":"Tenká lišta s telefonem na techniky a vstupem pro montážní firmy. Polské číslo je silný signál důvěry, z šesti prověřených konkurentů ho mají jen dva. Na mobilu se lišta schová a telefon je v menu.","z":"4.3","s":"Benchmark konkurence, 31. 10. 2026","tag":["design","klient"]},"header":{"t":"Hlavička","d":"Pět položek menu bez mega menu, katalog má tři kategorie a čtyři hlavní produkty. Hledání, jazyk, účet a košík vpravo. Na mobilu menu pod hamburgerem, košík a hledání zůstávají vidět.","z":"4.3","s":"NN/g Menu-Design Checklist, 6/2024; Baymard: malý katalog nedělit uměle","tag":["design"]},"lang":{"t":"Přepínač jazyka","d":"Textově Polski / English, bez vlajek. Angličtina je automatický překlad Shopify, němčina přibude po překladu klientem. Měnu přepínač nemění, PLN platí pro obě verze.","z":"3.2.3, 4.3","s":"NN/g 2022: samotná vlajka jako přepínač nedoporučeno; Baymard: výběr jazyka ne v překryvném dialogu","tag":["design"]},"dd":{"t":"Menu s produkty","d":"Tři přenosné řady rovnou v menu: fotka, jeden rozdíl, cena od. U malého katalogu to ušetří krok přes kategorii.","z":"4.3","s":"Baymard 2023: v kartě produktu 1 až 3 klíčové parametry","tag":["design"]},"footer":{"t":"Patička","d":"Kontakty, právní texty od klienta, platby, druhý přepínač jazyka a odkaz na zpětný odběr elektrozařízení.","z":"3.4.1","tag":["sablona"]},"newsletter":{"t":"Newsletter","d":"Prosté přihlášení přes Shopify Messaging, bez slevy za e-mail. Když bude klient chtít slevu, doplní se pravidla a souhlas.","z":"3.5.2","tag":["sablona"]},"legal_footer":{"t":"Povinné údaje provozovatele","d":"Sídlo, IČO, DIČ a zápis v obchodním rejstříku podle ARES (vložka 95171, ne 95226 jako na českém webu). Firma z jiného státu, která prodává elektrozařízení na dálku domácnostem v Polsku, musí mít v Polsku autorizovaného zástupce; jeho číslo BDO patří na faktury z CRM. V zadání chybí.","z":"3.4.1","s":"Ustawa o zużytym sprzęcie, Dz.U. 2024 poz. 573, čl. 26 odst. 2 a čl. 12","tag":["klient","navic"]},"hero":{"t":"Úvod stránky","d":"H1 je věta klienta z komentáře 7. 10. Pod ní jediné místo na stránce, kde jsou tři situace použití (doma, chata, cesty), potom tři fakta: výkon, FVE, jedna aplikace. Cena od stojí před tlačítkem. Hlavní tlačítko vede rovnou do konfigurátoru PRO II.","z":"4.3","s":"Komentáře klienta k obsahovému návrhu, 7. 10. 2026","tag":["design"]},"proof":{"t":"Pruh důvěry","d":"Čtyři důvody věřit nové značce. Druhá položka se mění s ukázkovým stavem Hodnocení: bez recenzí zákonná záruka a servis, s recenzemi hodnocení českého obchodu (jen se souhlasem klienta a po právní kontrole). Norma IEC 62752:2024 je na stránce jen jednou, v bloku bezpečnosti.","s":"ARES: vznik 21. 9. 2016; hodnocení českého obchodu výrobce 5,0 ze 70","tag":["design","overit"]},"paths":{"t":"Přenosný, nebo nástěnný","d":"Dvě vstupní brány podle toho, na kolika místech zákazník nabíjí, s klíčovými údaji a cenou od. Není to doporučovací nástroj, ten klient nechce.","z":"4.3","tag":["design"]},"fve":{"t":"Nabíjení z přebytků FVE","d":"Podle klienta největší trhák, proto tmavý blok přes celou šířku. Schéma ukazuje tok energie ve třech situacích, hodnoty jsou ilustrační. Seznam systémů je ověřený v návodu a na portálu výrobce, včetně Loxone. Loxone ani Shelly nezmiňuje žádný konkurent.","z":"4.3","s":"Komentář klienta 7. 10. 2026; zákaznický portál výrobce; benchmark konkurence","tag":["design","overit"]},"app":{"t":"Aplikace EV-Manager","d":"Tři funkce, které klient sám označil za nejužitečnější. Stejná aplikace pro přenosný i nástěnný wallbox. Screenshoty v polštině dodá klient.","s":"Komentář klienta 7. 10. 2026; návod v1.5","tag":["design","klient"]},"safety":{"t":"Bezpečnost","d":"Argument elektrikáře: chránič typu B s testem před každým nabíjením je přímo v jednotce, proto je bezpečná každá zásuvka. Jediný pás přes celou šířku jako tabulka, aby stránka nebyla jen střídání textu a obrázku. Krytí k potvrzení: e-shop IP67, návod IP54.","s":"Návod k přenosnému wallboxu v1.5; parametry na českém e-shopu výrobce","tag":["design","overit"]},"reviews":{"t":"Hodnocení","d":"Po spuštění bez recenzí: neutrální stav, ne nula hvězd. Varianta s recenzemi ukazuje doslovné citace z Česka. Úprava názvu produktu v převzatých recenzích může být podle polského práva zkreslení recenzí, posoudí právník. U recenzí bude odkaz, jak je ověřujeme.","z":"3.1.2","s":"Baymard: produkt s málo recenzemi lidé nezkoumají; ustawa o przeciwdziałaniu nieuczciwym praktykom rynkowym, čl. 7 bod 25 a 26","tag":["design","overit"]},"help":{"t":"Rada od odborníka","d":"Věta klienta Pojďte si k nám pro radu. Všechny kanály vedou k technické podpoře výrobce, zákazníka nikam neposíláme. Kdo přesně odpovídá a v jakém jazyce, potvrdí klient.","z":"4.3","tag":["design"]},"channels":{"t":"Kanály podpory","d":"Chat, telefon, e-mail, návody. Na webech výrobce jsou dnes čtyři různá čísla a čtyři e-maily, pro Polsko je potřeba jeden kontakt a člověk, který mluví polsky.","s":"Rešerše produktových dat, 31. 10. 2026","tag":["klient"]},"partner_band":{"t":"Odkaz pro montážní firmy","d":"Krátký pruh na konci úvodní stránky. Hlavní vstup je v servisní liště a v patičce.","z":"3.1.4","tag":["design"]},"home_faq":{"t":"Otázky na úvodní stránce","d":"Pět otázek z jedné databáze FAQ. Spravují se na jednom místě a u produktů se zapínají jen související.","z":"3.1.3","tag":["design"]},"cat_head":{"t":"Záhlaví kategorie a pojmy","d":"V polštině se przenośny wallbox skoro nehledá (10 hledání za měsíc), hledá se mobilna ładowarka (210) a ładowarka EV (3 600). Doporučujeme nadpis podle klienta a v titulku a popisu pro vyhledávače polské výrazy, které lidé hledají.","s":"Keyword Planner Polsko, 6/2025 až 5/2026","tag":["design"]},"cat_filter":{"t":"Filtr výkonu","d":"Jediný filtr: výkon. U tří produktů víc filtrů nepomůže, další zapne Search & Discovery, až katalog naroste.","s":"Baymard: malý katalog nedělit uměle","tag":["sablona"]},"cat_fit":{"t":"Filtr podle řady","d":"U příslušenství rozhoduje, k čemu pasuje. Filtr podle řady místo technických parametrů.","tag":["design"]},"cat_grid":{"t":"Karty produktů","d":"Cena od, tři klíčové parametry, stav skladu z CRM. Hodnocení v kartě až po spuštění, vždy průměr i počet.","s":"Baymard: v kartě vždy průměr i počet hodnocení; Baymard 2023: polovina webů ukazuje v kartě málo údajů","tag":["design"]},"compare":{"t":"Srovnání řad","d":"Statická tabulka tří řad místo kvízu. Pro malý počet alternativ je tabulka nejlepší formát.","s":"NN/g Comparison tables, 2/2024","tag":["design"]},"cat_help":{"t":"Rada místo nástroje","d":"Na konci kategorie výzva k technikovi. Klient doporučovací nástroj výslovně nechce.","z":"4.3","tag":["design"]},"cat_seo":{"t":"Text pro vyhledávače","d":"Spravuje se v metapoli kategorie, je pod produkty, aby nepřekážel nákupu.","tag":["sablona"]},"gallery":{"t":"Galerie","d":"Čtvercová hlavní fotka a náhledy. Chybí fotky výměny adaptéru a zapojení do různých zásuvek, které by konkurenci předběhly.","tag":["klient"]},"pdp_rating":{"t":"Hodnocení pod názvem","d":"Bez recenzí text Zatím bez hodnocení, žádné prázdné hvězdy.","tag":["design"]},"pdp_keys":{"t":"Tři hlavní fakta","d":"Adaptéry, FVE, ochrana. Pořadí podle nákupních motivací z workshopu: funkce a aplikace, FVE a otevřenost, certifikace.","s":"Zápis z workshopu 3. 6. 2026","tag":["design"]},"configurator":{"t":"Konfigurátor příplatků","d":"Všechny volby jako tlačítka s příplatkem v zł s VAT. Výchozí je vždy varianta bez příplatku, takže cena od sedí. Na CZ e-shopu je šest povinných polí bez předvolby. Výkon a sada jsou skutečné varianty se skladem, ostatní příplatky. Barva konektoru a NF Krtek v Polsku nejsou.","z":"3.1.1, 4.3","s":"Baymard 2021: 80 % lidí klikalo na volby a sledovalo cenu; benchmark: konfigurátor s cenou příplatku v zł nemá žádný konkurent","tag":["design"]},"fve_option":{"t":"Volba FVE závisí na Wi-Fi","d":"Funkce pro FVE fungují jen s Wi-Fi. S Bluetooth je volba neaktivní, s vysvětlením a tlačítkem Přidat Wi-Fi. Aplikace pro příplatky musí umět podmíněnou logiku. Cenu potvrdí klient, zdroje výrobce se rozcházejí.","z":"3.1.1","s":"FAQ zákaznického portálu výrobce","tag":["design","overit"]},"set_warn":{"t":"Upozornění u sady Charger","d":"Charger je bez adaptérů. Upozorníme hned u volby, ne až po doručení.","s":"Benchmark: NRGkick upozorní na chybějící adaptér; zákazník Green Cell v recenzi píše, že adaptér 230 V kupoval zvlášť","tag":["design"]},"addons":{"t":"Adaptéry navíc","d":"Adaptéry jsou samostatné produkty se skladem. Zaškrtnuté se přidají do košíku jako další položky a v souhrnu jsou vidět hned. Technicky přes propojené produkty v aplikaci příplatků, ověřit.","z":"3.1.1","s":"Konfigurátor výrobce: blok Potřebujete více koncovek?","tag":["design","overit"]},"summary":{"t":"Vaše sestava","d":"Každá volba je řádek s cenou a celková cena se přepočítá hned. Stejné řádky se objeví v košíku, v potvrzení a v objednávce pro CRM jako název a hodnota.","z":"3.1.1, 7.1","tag":["design"]},"stock":{"t":"Dostupnost a doručení","d":"Sklad bere Shopify z CRM. Odhad doručení s konkrétním dnem místo obecné rychlosti, časy expedice z Česka doplní klient. Odhad dne doručení potřebuje aplikaci nebo úpravu šablony.","z":"3.3.1","s":"Baymard 2026: odhad celkové ceny u tlačítka nemá 67 % webů","tag":["design","klient","navic"]},"notify":{"t":"Hlídání dostupnosti","d":"Když se produkt vyrábí, místo tlačítka e-mail pro upozornění. Hlídání dostupnosti potřebuje aplikaci (např. e-mailové upozornění na naskladnění).","tag":["design","navic"]},"pdp_trust":{"t":"Polský blok důvěry","d":"Pod tlačítkem Paczkomat, BLIK, vrácení, záruka. Ceny dopravy doplní klient. Doprava zdarma je důležitá pro 88 % Poláků a 47 % kvůli poštovnému mění obchod.","s":"Gemius E-commerce w Polsce 2026","tag":["design","klient"]},"pdp_ask":{"t":"Zeptat se technika","d":"Rada přímo u konfigurátoru, otevře chat. Ideálně s fotkou konkrétního technika.","tag":["design"]},"sticky":{"t":"Lepivá lišta na mobilu","d":"Po odscrollování konfigurátoru ukazuje aktuální cenu sestavy a tlačítko. Bublina chatu se posune nad ni.","s":"Baymard 2026: lepivé tlačítko s okrajem, ne přes celou šířku","tag":["design"]},"ptabs":{"t":"Navigace po stránce","d":"Kotvy na části detailu zůstávají nahoře, dlouhá stránka se dá proskákat.","tag":["design"]},"pdp_desc":{"t":"Popis","d":"Tři krátké odstavce a tři situace použití. Žádné výčty bezpečnostních názvů jako HeatSense, zákazník potřebuje vědět, co funkce dělá.","tag":["design"]},"charge_time":{"t":"Doba nabíjení","d":"Tabulka je fyzika, ne doporučovací nástroj. Řádek 230 V doplní výrobce podle proudu adaptéru.","s":"Benchmark: go-e i Green Cell dobu nabíjení ukazují","tag":["design","klient"]},"pdp_box":{"t":"Obsah balení podle sady","d":"Co ve zvolené sadě není, zešedne. U sady Plus se zdroje výrobce rozcházejí (popis a obrázek rozdílů), potvrdí klient.","tag":["design","overit"]},"pdp_specs":{"t":"Parametry","d":"Skupiny podle témat, hodnoty se mění podle výkonu (průřez kabelu 5G2,5 mm² u 11 kW, 5G6 mm² u 22 kW). Rozpory na webech výrobce jsou označené: krytí IP67 a IP54, OCPP 2.0 a 1.6J, hmotnost a rozměry e-shop proti návodu.","s":"Baymard 9/2026: 64 % webů má slabou specifikaci","tag":["design","overit"]},"pdp_fve":{"t":"FVE na detailu","d":"Podmínky na rovinu: Wi-Fi ve stejné síti, LTE nestačí, Shelly pro ostatní značky.","tag":["design"]},"pdp_dl":{"t":"Návody a soubory","d":"Přes metapole, polské verze dodá klient. Prohlášení o shodě pro PRO II je na webu výrobce zatím jen připravované.","z":"3.2.4","tag":["klient"]},"pdp_faq":{"t":"Časté otázky u produktu","d":"Accordion z jedné databáze, u produktu jen související otázky. Google od 7. 5. 2026 FAQ ve výsledcích hledání nezobrazuje, přínos je pro zákazníky a AI vyhledávače. Argument v zadání proto upravit.","z":"3.1.3","s":"Google Search Central, changelog FAQPage","tag":["design"]},"pdp_reviews":{"t":"Hodnocení na detailu","d":"Aplikace Judge.me, do spuštění neutrální stav.","z":"3.1.2","tag":["sablona"]},"gpsr":{"t":"Výrobce a bezpečnost","d":"Povinný blok podle GPSR: výrobce, poštovní a e-mailová adresa, označení výrobku a bezpečnostní informace polsky. Platí i pro wallboxy s CE. V zadání chybí.","s":"Nařízení (EU) 2023/988, čl. 19","tag":["navic"]},"fit":{"t":"Kompatibilita","d":"U příslušenství vždy, k jaké řadě pasuje.","tag":["design"]},"related":{"t":"Příslušenství k řadě","d":"Související produkty přes metapole.","z":"3.2.4","tag":["sablona"]},"omnibus":{"t":"Sleva a nejnižší cena","d":"Při slevě vedle přeškrtnuté ceny nejnižší cena za 30 dní před slevou. Shopify to nativně neumí, je potřeba aplikace.","s":"Ustawa o informowaniu o cenach, Dz.U. 2023 poz. 168, čl. 4 odst. 2","tag":["navic"]},"lite":{"t":"Maveiro Lite","d":"Nový produkt: termín, cenu, obsah balení a tarify funkcí potvrdí výrobce. Do té doby stránka nabízí jen hlídání dostupnosti a cenu neukazuje.","z":"3.1.1","tag":["klient"]},"guarantee":{"t":"Záruka ve vysouvacím košíku","d":"Krátká věta a odkaz. Celé oznámení je v košíku před pokladnou.","z":"3.4.1","tag":["design"]},"notice":{"t":"Harmonizované oznámení o záruce","d":"Celé oznámení EU (obrázek v barvě s QR kódem) v košíku před tlačítkem do pokladny. Text nelze upravit a dodává ho Komise, ne klient. Krátký text s odkazem podle zadání je rizikový. V Polsku povinné až od 27. 9. 2027, zadání uvádí 2026; termín podle rozhodného práva posoudí právník.","z":"3.4.1","s":"Prováděcí nařízení Komise (EU) 2025/1960; Dz.U. 2026 poz. 1353","tag":["design","overit"]},"drawer":{"t":"Vysouvací košík","d":"Potvrdí vložení a ukáže sestavu se všemi příplatky.","tag":["sablona"]},"drawer_cta":{"t":"Z vysouvacího košíku do košíku","d":"Nevede rovnou do pokladny. Paczkomat se na tarifu Grow s aplikací Globe vybírá v košíku a harmonizované oznámení musí zákazník vidět před pokladnou.","s":"Globe Pickup Points, App Store, 31. 10. 2026","tag":["design"]},"cart_empty":{"t":"Prázdný košík","d":"Odkaz na hlavní kategorii.","tag":["sablona"]},"cart_lines":{"t":"Položky košíku","d":"Příplatky jako řádky název: hodnota s cenou. Upravit sestavu vrátí na detail s předvyplněnými volbami, ověřit v aplikaci příplatků.","z":"4.3, 7.1","tag":["design","overit"]},"pickup":{"t":"Výběr Paczkomatu v košíku","d":"Výdejní automaty používá 84 % Poláků, 82 % z nich InPost. Na Grow jde výběr jen v košíku nebo po objednávce, v pokladně až na Plus. Bez vybraného automatu nejde pokračovat. Ověřit, zda se balení wallboxu do schránky vejde.","z":"3.2.2","s":"Gemius 2026; Globe Pickup Points, App Store","tag":["navic","klient"]},"transfer":{"t":"Sleva za převod","d":"Slevu podle zvolené platby Shopify v pokladně neumí. Řešení: přepínač v košíku přes aplikaci (PaySelect, BTD), pokladna pak nabídne jen převod. Výši slevy v zł určí klient. Převod v Polsku používá 10 % lidí, BLIK 67 %, sleva tedy osloví menšinu.","z":"3.2.1","s":"Gemius 2026; shopify.dev Discount Function API","tag":["design","overit"]},"xsell":{"t":"Doporučení v košíku","d":"Jen příslušenství k řadě v košíku, nic nesouvisejícího.","tag":["design"]},"cart_sum":{"t":"Shrnutí košíku","d":"Celková cena včetně dopravy a slevy dřív, než zákazník odejde do pokladny. Dodatečné poštovné odrazuje 51 % Poláků.","s":"Gemius 2026; Baymard 2025: extra náklady 40 %","tag":["design"]},"cart_cta":{"t":"Do pokladny","d":"Text z obsahového návrhu, klient k němu neměl připomínku.","tag":["design"]},"checkout":{"t":"Pokladna Shopify","d":"Nativní pokladna, upravuje se logo, barvy a texty. Na Grow do ní nejde přidat vlastní obsah, proto je Paczkomat a záruka v košíku.","z":"3.2","tag":["sablona"]},"co_ship":{"t":"Doprava v pokladně","d":"Převzatá z košíku včetně vybraného automatu.","tag":["sablona"]},"co_pay":{"t":"Platby","d":"BLIK první, používá ho 67 % Poláků a pro 53 % je nejčastější. Przelewy24 jako rychlý převod. Obojí jde přes Shopify Payments i pro českou firmu; Przelewy24 schvaluje poskytovatel několik týdnů a vyžaduje zveřejněné podmínky vrácení a ochrany údajů. V zadání chybí.","z":"3.2.1","s":"Gemius 2026; Shopify help BLIK a Przelewy24; changelog 30. 5. 2026","tag":["navic"]},"co_button":{"t":"Tlačítko objednávky","d":"Polský zákon vyžaduje text zamówienie z obowiązkiem zapłaty nebo stejně jednoznačný, jinak smlouva nevznikne. Nastavit v textech pokladny.","s":"Ustawa o prawach konsumenta, čl. 17 odst. 3","tag":["navic"]},"co_summary":{"t":"Souhrn objednávky","d":"Stejné řádky příplatků jako v košíku.","tag":["sablona"]},"thanks":{"t":"Děkovací stránka","d":"Vysvětlí, které e-maily přijdou, aby zákazník nedostal nic dvakrát (Shopify a CRM). Přidaná informace o bezplatném odběru starého spotřebiče.","z":"3.3.1","s":"Ustawa o zużytym sprzęcie, čl. 37","tag":["design","klient"]},"thanks_app":{"t":"Aplikace po nákupu","d":"Zákazník si aplikaci stáhne dřív, než balík dorazí. Aplikace je podle workshopu hlavní nástroj retence.","s":"Zápis z workshopu 3. 6. 2026","tag":["design"]},"search":{"t":"Výsledky hledání","d":"Produkty a odpovědi z databáze FAQ zvlášť. Odpovědi z FAQ ve výsledcích hledání nativní vyhledávání neumí, potřebuje vývoj nebo aplikaci.","tag":["sablona","navic"]},"search_empty":{"t":"Nic nenalezeno","d":"Návrh obecnějšího slova a cesta k technikovi.","tag":["sablona"]},"account":{"t":"Účet","d":"Nové zákaznické účty Shopify s jednorázovým kódem. V účtu odkaz na odstoupení od smlouvy.","tag":["sablona"]},"cookie":{"t":"Cookies","d":"Nativní lišta Shopify má Přijmout, Odmítnout i Předvolby. Chatbot a měření se spustí až po souhlasu přes Customer Privacy API.","z":"3.4.1","s":"Zdrojový kód banneru Shopify, 31. 10. 2026","tag":["sablona"]},"chat":{"t":"Chatbot klienta","d":"Okno označené jako AI asistent (AI Act čl. 50, podle sekundárních zdrojů od 2. 8. 2026). Kód vloží klient, chatbot se načte až po souhlasu s cookies. V polštině se jmenuje Volty.","z":"3.1.5","tag":["klient","overit"]},"chat_teaser":{"t":"Vyskočení po 10 sekundách","d":"Zadání chce vyskočení po 10 s. Baymard automaticky otevíraný chat nedoporučuje a 26 % Poláků mění obchod kvůli vyskakovacím oknům. Proto jen malá bublina bez překrytí obsahu, ne na mobilu, v košíku ani pokladně, a po zavření se už neukáže. Doporučujeme A/B test.","z":"3.1.5","s":"Baymard 2026: automaticky otevíraný chat nedoporučuje; Gemius 2026","tag":["design","overit"]},"contact_head":{"t":"Kontakt","d":"Stránka v rozsahu grafického návrhu. Nejdřív kanály podpory, potom formulář. Kdo odpovídá a v jakém jazyce, potvrdí klient.","z":"2.5, 4.1","tag":["design"]},"contact_company":{"t":"Údaje provozovatele","d":"Sídlo a DIČ podle ARES. Adresu pro vrácení zboží a číslo BDO doplní klient.","s":"ARES, 31. 10. 2026","tag":["klient"]},"contact_form":{"t":"Kontaktní formulář","d":"Shopify Forms: téma, jméno, e-mail, telefon nepovinný, číslo objednávky. Shopify Forms vyžaduje povinný e-mail nebo telefon.","z":"3.5.2","s":"Shopify help, Forms","tag":["design"]},"about_head":{"t":"O nás","d":"Stránka v rozsahu designu. Výrobce z Česka, na trhu od 2016. Zda zmínit původ produktů z českého e-shopu výrobce, rozhodne klient.","z":"2.5","tag":["design","klient"]},"about_diff":{"t":"Co děláme jinak","d":"Tři konkrétní věci, které zákazník dostane, bez srovnávacích tvrzení o konkurenci.","tag":["design"]},"about_prod":{"t":"Výroba a milníky","d":"Fotky z výroby a ověřené milníky. Roky doplní klient, vznik firmy podle ARES.","tag":["klient"]},"about_team":{"t":"Lidé","d":"Skutečné tváře podpory budují důvěru u nové značky. Fotky a jména dodá klient.","tag":["klient"]},"partner_head":{"t":"Staňte se partnerem","d":"Obsahová stránka ze šablony s formulářem. Instalaci v Polsku zajišťují partneři.","z":"3.1.4","tag":["sablona"]},"partner_who":{"t":"Pro koho","d":"Tři skupiny. Montážníci FVE jsou nejcennější, prodávají fotovoltaiku a wallbox spolu.","tag":["design"]},"partner_get":{"t":"Co partner dostane","d":"Podmínky určí klient, wireframe pro ně drží místo.","tag":["klient"]},"partner_form":{"t":"Formulář partnera","d":"Shopify Forms: firma, NIP, vojvodství, typ činnosti. Odeslání nejspíš založí zákaznický profil a partneři se smíchají se zákazníky, ověřit.","z":"3.1.4","s":"Shopify help, Forms","tag":["design","overit"]},"partner_map":{"t":"Partneři podle vojvodství","d":"Seznam podle vojvodství, na začátku prázdný stav s poctivým textem. Klikací mapa vojvodství je vývoj navíc, jednodušší je seznam s filtrem.","z":"3.1.4","tag":["design","navic"]},"fve_head":{"t":"Stránka Nabíjení z FVE","d":"Hlavní argument potřebuje vlastní stránku s odkazem z menu. Ze šablony Shopify, mimo pět navržených stránek.","tag":["navic"]},"fve_modes":{"t":"Režimy SolarSync","d":"Názvy podle zákaznického portálu (Off, Eco, Eco+). E-shop používá starší Standard, sjednotit.","s":"zákaznický portál výrobce","tag":["overit"]},"fve_need":{"t":"Co je potřeba","d":"Tři podmínky v pořadí, v jakém je zákazník řeší.","tag":["design"]},"fve_systems":{"t":"Podporované systémy","d":"Ověřené integrace podle návodu a portálu výrobce. K potvrzení zůstává verze OCPP a to, zda bude placená.","tag":["design","overit"]},"support_head":{"t":"Podpora","d":"Rozcestník: technik, odpovědi, návody.","tag":["sablona"]},"support_faq":{"t":"Všechny otázky","d":"Celá databáze FAQ s filtrem podle témat. Aktualizovaný seznam dodá klient.","z":"3.1.3","tag":["klient"]},"support_dl":{"t":"Návody a dokumenty","d":"Všechny soubory z metapolí produktů na jednom místě. Odkazy na zákaznický portál EV-Manager.","z":"3.2.4","tag":["sablona"]},"ship_page":{"t":"Doprava a platba","d":"Dopravce, ceny a dobu doručení dodá klient. Zákon vyžaduje informaci o platbách a omezeních doručení nejpozději na začátku objednávky.","s":"Ustawa o prawach konsumenta, čl. 18","tag":["klient"]},"notice_page":{"t":"Stránka zákonné záruky","d":"Plné oznámení EU a lidské vysvětlení, jak reklamovat.","z":"3.4.1","tag":["sablona"]},"withdraw_page":{"t":"Odstoupení online","d":"Funkce odstoupení od smlouvy podle směrnice (EU) 2023/2673. Polské znění: odstąp od umowy tutaj a potwierdź odstąpienie od umowy. V Polsku je zákon zatím v návrhu (UC169), v Česku podle sekundárních zdrojů od 1. 1. 2027; záleží na rozhodném právu v obchodních podmínkách. Odkaz v patičce, v účtu a na stránce stavu objednávky. V zadání chybí.","s":"UOKiK, dopis 25. 11. 2024; RCL projekt UC169","tag":["navic","overit"]},"weee_page":{"t":"Zpětný odběr elektrozařízení","d":"Prodejce na dálku musí při doručení zdarma odebrat starý spotřebič stejného druhu a informovat o tom na webu. U doručení do Paczkomatu z Česka je potřeba vymyslet postup. V zadání chybí.","s":"Ustawa o zużytym sprzęcie, Dz.U. 2024 poz. 573, čl. 37","tag":["navic","klient"]},"legal_page":{"t":"Právní texty","d":"Dodá klient v polštině. Do obchodních podmínek patří i informace o přístupnosti (EAA, pokud R-EVC není mikropodnik) a o ověřování recenzí. Przelewy24 vyžaduje zveřejněné podmínky vrácení a ochrany údajů.","z":"3.4.1","tag":["klient"]},"pdp_price":{"t":"Cena u názvu","d":"Aktuální cena sestavy hned pod názvem, mění se s každou volbou. Zákazník nemusí scrollovat k souhrnu, aby věděl, kolik zaplatí.","s":"Baymard 2026: odhad celkové ceny u nákupní části nemá 67 % webů","tag":["design"]},"consent":{"t":"Souhlas s okamžitou aktivací funkcí","d":"Funkce pro FVE jsou digitální obsah. Pokud se aktivují hned, zákazník musí předem výslovně souhlasit a vzít na vědomí ztrátu práva na odstoupení; jinak mu právo zůstává. Na Grow nejde prvek přidat do pokladny, proto je v košíku. Text a to, zda souhlas bude povinný, určí právník klienta.","s":"Obchodní podmínky českého e-shopu výrobce, čl. XII","tag":["navic","overit"]}},"pages":{"kontakt":{"title":"Kontakt","crumb":null,"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"contact_head\"><h1>Kontakt<\/h1><p class=\"lead\">Na dotazy odpovídá technická podpora výrobce [[polsky]]. Nejrychleji odpoví chat, s objednávkou pomůže telefon.<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap cols c12\">\n  <div>\n    <h2 style=\"font-size:24px;margin-bottom:16px\">Jak nás zastihnete<\/h2>\n    {{channels}}\n    <h3 style=\"margin:32px 0 12px\">Provozovatel obchodu a výrobce<\/h3>\n    <ul class=\"kvl\" data-note=\"contact_company\">\n      <li><b>R-EVC s.r.o.<\/b>Mokrá 317, 664 04 Mokrá-Horákov, Česko<\/li>\n      <li><b>IČO a DIČ<\/b>05403570, CZ05403570, zapsaná u Krajského soudu v Brně, oddíl C, vložka 95171<\/li>\n      <li><b>Číslo BDO<\/b>[[číslo autorizovaného zástupce v Polsku]]<\/li>\n      <li><b>Adresa pro vrácení zboží<\/b>[[adresa skladu v ČR]]<\/li>\n    <\/ul>\n  <\/div>\n  <div data-note=\"contact_form\">\n    <h2 style=\"font-size:24px;margin-bottom:8px\">Napište nám<\/h2>\n    <p>Do zprávy připište elektromobil, zásuvky, které máte k dispozici, a jestli máte FVE. Ušetříte si jedno kolo otázek.<\/p>\n    {{form:contact}}\n  <\/div>\n<\/div><\/section>"},"o-nas":{"title":"O nás","crumb":null,"html":"<section class=\"pghead\"><div class=\"wrap cols c21\" data-note=\"about_head\"><div><h1>Maveiro vyrábí R-EVC<\/h1><p class=\"lead\">Jsme česká firma, která přenosné a nástěnné wallboxy sama vyvíjí a vyrábí. Pět let je prodáváme v Česku. Maveiro je naše značka pro další evropské trhy, Polsko je první z nich.<\/p><\/div><\/div><\/section>\n<section class=\"sec\"><div class=\"wrap cols\" data-note=\"about_diff\">\n  <div><h2>Co od nás dostanete<\/h2><\/div>\n  <div style=\"border-top:1px solid var(--line)\">\n    <div style=\"padding:16px 0;border-bottom:1px solid var(--line)\"><b>Ochranu přímo v jednotce<\/b><p style=\"margin:4px 0 0\">Chránič typu B s testem před každým nabíjením a hlídání teploty jsou přímo v jednotce, podle normy IEC 62752:2024.<\/p><\/div>\n    <div style=\"padding:16px 0;border-bottom:1px solid var(--line)\"><b>Otevřené napojení<\/b><p style=\"margin:4px 0 0\">Přebytky čte ze střídače Solax G4 a GoodWe ET, u ostatních značek z elektroměru Shelly. Přes Modbus TCP a lokální API ho řídí Home Assistant nebo Loxone, přes OCPP nabíjecí backend [[OCPP jako placená funkce]].<\/p><\/div>\n    <div style=\"padding:16px 0;border-bottom:1px solid var(--line)\"><b>Technickou podporu výrobce<\/b><p style=\"margin:4px 0 0\">Na dotazy k zapojení, aplikaci i reklamaci odpovídá podpora výrobce. [[Polsky, jména a hodiny potvrdí klient.]]<\/p><\/div>\n  <\/div>\n<\/div><\/section>\n<section class=\"sec alt\"><div class=\"wrap cols\" data-note=\"about_prod\">\n  <div>{{ph:Foto-z-výroby:-osazování-elektroniky-a-zkouška-hotového-wallboxu}}<\/div>\n  <div><h2>Výroba a zkoušky<\/h2><p style=\"margin-top:12px\">Wallboxy skládáme a zkoušíme v [[místo výroby]]. Každý kus před odesláním [[projde výstupní zkouškou]]. Firmware se aktualizuje vzdáleně a nové funkce přicházejí do aplikace EV-Manager.<\/p>\n    <ul class=\"timeline\" style=\"margin-top:24px\">\n      <li><b>2016<\/b>Založení R-EVC s.r.o.<\/li>\n      <li><b>[[rok]]<\/b>První přenosný wallbox v prodeji v Česku<\/li>\n      <li><b>2026<\/b>Nová evropská značka Maveiro<\/li>\n      <li><b>2027<\/b>Spuštění obchodu v Polsku<\/li>\n    <\/ul>\n  <\/div>\n<\/div><\/section>\n<section class=\"sec\"><div class=\"wrap\" data-note=\"about_team\"><div class=\"shead\"><div><h2>Kdo vám odpoví<\/h2><p>Lidé z podpory, se kterými budete mluvit e-mailem a po telefonu. [[Fotky a jména dodá klient.]]<\/p><\/div><\/div>\n  <div class=\"cols c3\">\n    <div>{{ph:Foto:-technik-podpory}}<h3 style=\"margin-top:12px\">[[Jméno]]<\/h3><p class=\"small\">[[Technická podpora, mluví polsky]]<\/p><\/div>\n    <div>{{ph:Foto:-vedoucí-vývoje}}<h3 style=\"margin-top:12px\">[[Jméno]]<\/h3><p class=\"small\">[[Vývoj elektroniky]]<\/p><\/div>\n    <div>{{ph:Foto:-zakladatel}}<h3 style=\"margin-top:12px\">Tomáš Richtr<\/h3><p class=\"small\">[[Zakladatel, elektrikář]]<\/p><\/div>\n  <\/div>\n<\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap\"><div class=\"band\"><div><h2>Pojďte si k nám pro radu<\/h2><p>Napište, jaký máte elektromobil a kde nabíjíte. Doporučíme konkrétní sestavu.<\/p><\/div><a class=\"btn\" href=\"#/kontakt\">Napsat technikovi<\/a><\/div><\/div><\/section>"},"partneri":{"title":"Staňte se partnerem","crumb":null,"html":"<section class=\"pghead\"><div class=\"wrap cols c21\" data-note=\"partner_head\"><div><h1>Pro montážní firmy a prodejce<\/h1><p class=\"lead\">Maveiro v Polsku montáž nenabízí. Zákazníkům, kteří potřebují nainstalovat nástěnný wallbox nebo osadit elektroměr pro FVE, doporučíme montážní firmu z jejich vojvodství.<\/p><\/div><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap cols c3\" data-note=\"partner_who\">\n  <div><h3>Elektromontážní firmy<\/h3><p class=\"small\" style=\"margin-top:6px\">Instalujete wallboxy a jističe, děláte revize. Zákazníkům z e-shopu, kteří montáž potřebují, vás doporučíme.<\/p><\/div>\n  <div><h3>Montážníci FVE<\/h3><p class=\"small\" style=\"margin-top:6px\">K fotovoltaice nabídnete wallbox, který nabíjí z přebytků a domluví se se střídačem vašeho zákazníka.<\/p><\/div>\n  <div><h3>Prodejci<\/h3><p class=\"small\" style=\"margin-top:6px\">Prodáváte příslušenství k elektromobilům nebo elektroinstalační materiál a chcete Maveiro v nabídce.<\/p><\/div>\n<\/div><\/section>\n<section class=\"sec alt\"><div class=\"wrap cols\" data-note=\"partner_get\">\n  <div><h2>Co od nás dostanete<\/h2><ul style=\"margin-top:16px\">\n    <li>[[Partnerské ceny a podmínky]]<\/li>\n    <li>[[Poptávky zákazníků z vašeho vojvodství]]<\/li>\n    <li>Technickou podporu výrobce [[i při instalaci u zákazníka, potvrdí klient]]<\/li>\n    <li>[[Školení k zapojení a nastavení FVE]]<\/li>\n    <li>Uvedení na mapě partnerů na maveiro.pl<\/li>\n  <\/ul><\/div>\n  <div><h2>Jak to probíhá<\/h2><ol class=\"steps\">\n    <li><div><b>Vyplníte formulář<\/b><p>Firma, region a čím se zabýváte.<\/p><\/div><\/li>\n    <li><div><b>Zavolá vám technik<\/b><p>[[Do 3 pracovních dnů]] probereme vaši práci a co od spolupráce čekáte.<\/p><\/div><\/li>\n    <li><div><b>Domluvíme podmínky<\/b><p>[[Partnerská smlouva a přístup k cenám]]<\/p><\/div><\/li>\n  <\/ol><\/div>\n<\/div><\/section>\n<section class=\"sec\" id=\"formular\"><div class=\"wrap cols c12\">\n  <div><h2>Žádost o partnerství<\/h2><p style=\"margin-top:12px\">Odpovíme e-mailem a pak zavoláme. Údaje použijeme jen pro domluvu spolupráce.<\/p><\/div>\n  <div data-note=\"partner_form\">{{form:partner}}<\/div>\n<\/div><\/section>\n<section class=\"sec alt\"><div class=\"wrap\" data-note=\"partner_map\"><div class=\"shead\"><div><h2>Najděte partnera ve svém okolí<\/h2><p>Seznam montážních firem podle vojvodství. Pro zákazníky, kteří kupují nástěnný wallbox.<\/p><\/div><\/div>{{partners}}<\/div><\/section>"},"fve":{"title":"Nabíjení z FVE","crumb":null,"html":"<section class=\"pghead\"><div class=\"wrap cols c21\" data-note=\"fve_head\"><div><h1>Nabíjení z přebytků FVE<\/h1><p class=\"lead\">Wallbox čte data ze střídače nebo z elektroměru Shelly a do elektromobilu pošle jen to, co by teklo do sítě. Proud mění po 1 A od 6 A. Potřebuje Wi-Fi a funkce pro FVE.<\/p><\/div><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap cols\">\n  <div>{{flow}}<\/div>\n  <div data-note=\"fve_modes\"><h2>Tři režimy, přepínáte v aplikaci<\/h2>\n    <dl style=\"margin:16px 0 0;border-top:1px solid var(--line)\">\n      <div style=\"padding:14px 0;border-bottom:1px solid var(--line)\"><dt style=\"font-weight:700\">Off<\/dt><dd style=\"margin:4px 0 0;color:var(--ink-2)\">Nabíjí zvoleným proudem bez ohledu na slunce. Když potřebujete mít ráno nabito.<\/dd><\/div>\n      <div style=\"padding:14px 0;border-bottom:1px solid var(--line)\"><dt style=\"font-weight:700\">Eco<\/dt><dd style=\"margin:4px 0 0;color:var(--ink-2)\">Když přebytek klesne pod 6 A, doplní ze sítě nejvýš 3 A. Když nestačí ani to, nabíjení počká.<\/dd><\/div>\n      <div style=\"padding:14px 0;border-bottom:1px solid var(--line)\"><dt style=\"font-weight:700\">Eco+<\/dt><dd style=\"margin:4px 0 0;color:var(--ink-2)\">Jen přebytek, nic ze sítě. Začne od 6 A, a když slunce ubude, počká. Na víkend, dovolenou nebo práci z domu.<\/dd><\/div>\n    <\/dl>\n  <\/div>\n<\/div><\/section>\n<section class=\"sec alt\"><div class=\"wrap cols\">\n  <div data-note=\"fve_need\"><h2>Co budete potřebovat<\/h2><ol class=\"steps\">\n    <li><div><b>Wallbox s Wi-Fi<\/b><p>Ve stejné místní síti jako střídač nebo elektroměr. Nástěnný wallbox i přes Ethernet. Samotné LTE nestačí.<\/p><\/div><\/li>\n    <li><div><b>Zdroj dat o výrobě<\/b><p>Střídač Solax G4 nebo GoodWe řady ET, nebo pro jakoukoli jinou značku elektroměr Shelly 3EM či Pro 3EM, který do rozvaděče osadí elektrikář. <a href=\"#/produkt/shelly-pro-3em\">Shelly Pro 3EM<\/a> [[v nabídce obchodu, potvrdí klient]].<\/p><\/div><\/li>\n    <li><div><b>Funkce pro FVE<\/b><p>SolarSync, ChargeSafe a Offgrid aktivujete jednorázově [[cenu potvrdí výrobce]], při nákupu wallboxu nebo později v aplikaci. Platí trvale, bez měsíčních poplatků.<\/p><\/div><\/li>\n  <\/ol><\/div>\n  <div data-note=\"fve_systems\"><h2>Podporované systémy<\/h2>\n    <table class=\"dtable\" style=\"margin-top:16px\"><thead><tr><th>Systém<\/th><th>Připojení<\/th><\/tr><\/thead><tbody>\n      <tr><td>Solax G4<\/td><td>Přímo, Modbus TCP, bez dalšího hardwaru<\/td><\/tr>\n      <tr><td>GoodWe řady ET<\/td><td>Přímo, Modbus TCP<\/td><\/tr>\n      <tr><td>Huawei, SMA, Fronius, Solis, Victron, Deye<\/td><td>Přes elektroměr Shelly 3EM nebo Pro 3EM<\/td><\/tr>\n      <tr><td>Deye<\/td><td>Přímá integrace se připravuje, přijde aktualizací zdarma<\/td><\/tr>\n      <tr><td>Home Assistant<\/td><td>Lokální API, návod ve videu<\/td><\/tr>\n      <tr><td>Loxone<\/td><td>Modbus TCP, šablona ke stažení<\/td><\/tr>\n      <tr><td>SundayGate, Solar-Station, Solarmanager, Clever-PV<\/td><td>Přes API<\/td><\/tr>\n      <tr><td>Nabíjecí sítě a správa flotil<\/td><td>OCPP [[1.6J, placená funkce]]<\/td><\/tr>\n    <\/tbody><\/table>\n    <p class=\"small\" style=\"margin-top:12px\">ChargeSafe hlídá hlavní jistič: když doma běží bojler nebo tepelné čerpadlo, sníží nabíjecí proud. Offgrid nabíjí podle stavu domácí baterie u střídačů Solax G4 a GoodWe ET, i když distributor zakázal přetoky.<\/p>\n  <\/div>\n<\/div><\/section>\n<section class=\"sec\"><div class=\"wrap p2\"><div><h2>Časté otázky<\/h2><\/div>{{faq:fve}}<\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap\"><div class=\"band\"><div><h2>Pošlete značku a model střídače<\/h2><p>Technik vám napíše, co budete pro nabíjení z přebytků potřebovat.<\/p><\/div><a class=\"btn\" href=\"#/kontakt\">Napsat technikovi<\/a><\/div><\/div><\/section>"},"podpora":{"title":"Podpora","crumb":null,"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"support_head\"><h1>Podpora<\/h1><p class=\"lead\">Návody, odpovědi na časté otázky a kontakt na techniky na jednom místě.<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap cols c12\">\n  <div><h2 style=\"font-size:24px;margin-bottom:16px\">Zeptejte se technika<\/h2>{{channels}}<p class=\"small\" style=\"margin-top:16px\">Vracíte zboží? <a href=\"#/odstoupeni\">Odstoupení od smlouvy<\/a>. Reklamace podle <a href=\"#/reklamacni-rad\">reklamačního řádu<\/a>.<\/p><\/div>\n  <div data-note=\"support_faq\"><h2 style=\"font-size:24px;margin-bottom:16px\">Časté otázky<\/h2>{{faqall}}<\/div>\n<\/div><\/section>\n<section class=\"sec alt\" id=\"navody\"><div class=\"wrap\" data-note=\"support_dl\"><div class=\"shead\"><div><h2>Návody a dokumenty<\/h2><p>[[Polské návody dodá výrobce.]] Technické dokumenty k napojení (OCPP, Modbus) jsou v angličtině.<\/p><\/div><\/div>{{downloads}}<\/div><\/section>"},"doprava-a-platba":{"title":"Doprava a platba","crumb":["Podpora","#/podpora"],"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"ship_page\"><h1>Doprava a platba<\/h1><p class=\"lead\">Posíláme ze skladu výrobce v Česku. Fakturu vystavujeme my a posíláme ji e-mailem.<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap cols\">\n  <div><h2 style=\"font-size:24px;margin-bottom:12px\">Doprava<\/h2>\n    <table class=\"dtable\"><thead><tr><th>Způsob<\/th><th>Doručení<\/th><th>Cena<\/th><\/tr><\/thead><tbody>\n      <tr><td><b>Paczkomat InPost<\/b><br><span class=\"small\">vyberete v košíku<\/span><\/td><td>[[2 až 3 pracovní dny]]<\/td><td>[[zdarma]]<\/td><\/tr>\n      <tr><td><b>Kurýr<\/b><br><span class=\"small\">[[dopravce určí klient]]<\/span><\/td><td>[[2 až 3 pracovní dny]]<\/td><td>[[zdarma]]<\/td><\/tr>\n    <\/tbody><\/table>\n    <p class=\"small\" style=\"margin-top:12px\">Odesíláme do [[2 pracovních dnů]] od zaplacení, u dobírky od objednání.<\/p>\n  <\/div>\n  <div><h2 style=\"font-size:24px;margin-bottom:12px\">Platba<\/h2>\n    <table class=\"dtable\"><thead><tr><th>Způsob<\/th><th>Poznámka<\/th><\/tr><\/thead><tbody>\n      <tr><td><b>BLIK<\/b><\/td><td>Kód z bankovní aplikace<\/td><\/tr>\n      <tr><td><b>Rychlý převod Przelewy24<\/b><\/td><td>Přes vaši banku<\/td><\/tr>\n      <tr><td><b>Karta, Apple Pay, Google Pay<\/b><\/td><td>Visa, Mastercard<\/td><\/tr>\n      <tr><td><b>Dobírka<\/b><\/td><td>Platíte kurýrovi, [[poplatek X zł]]<\/td><\/tr>\n      <tr><td><b>Bankovní převod<\/b><\/td><td>[[Sleva X zł]], údaje pošleme e-mailem; slevu zapnete v košíku<\/td><\/tr>\n    <\/tbody><\/table>\n  <\/div>\n<\/div><\/section>\n<section class=\"sec\"><div class=\"wrap p2\"><div><h2>Časté otázky<\/h2><\/div>{{faq:doprava}}<\/div><\/section>"},"zakonna-zaruka":{"title":"Zákonná záruka","crumb":["Podpora","#/podpora"],"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"notice_page\"><h1>Zákonná záruka<\/h1><p class=\"lead\">Na všechno zboží máte zákonnou záruku 2 roky. Když je vadné, máte nárok na opravu nebo výměnu, a když to nejde, na slevu nebo vrácení peněz.<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap cols\">\n  <div>{{ph:Harmonizované-oznámení-EU-o-zákonné-záruce,-polská-verze-v-barvě-s-QR-kódem.-Text-ani-grafiku-nelze-upravit}}<\/div>\n  <div class=\"prose\"><h2 style=\"margin-top:0\">Jak reklamovat<\/h2><p>Napište nám přes <a href=\"#/kontakt\">kontaktní formulář<\/a> nebo zavolejte. Připravte si číslo objednávky a sériové číslo ze štítku na zadní straně jednotky, začíná REVCR.<\/p><p>Wallbox opravuje přímo výrobce. Postup a lhůty popisuje <a href=\"#/reklamacni-rad\">reklamační řád<\/a>.<\/p><p class=\"small\">Text oznámení je stanovený předpisem EU a dodává ho Evropská komise ve všech jazycích.<\/p><\/div>\n<\/div><\/section>"},"odstoupeni":{"title":"Odstoupení od smlouvy","crumb":["Podpora","#/podpora"],"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"withdraw_page\"><h1>Odstoupení od smlouvy<\/h1><p class=\"lead\">Do 14 dnů od převzetí můžete od smlouvy odstoupit bez udání důvodu. Vyplňte formulář, potvrďte odstoupení a potvrzení přijde e-mailem. [[Výjimky určí obchodní podmínky.]]<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap cols c12\">\n  <div><h2 style=\"font-size:24px;margin-bottom:12px\">Jak to proběhne<\/h2><ol class=\"steps\">\n    <li><div><b>Vyplníte a potvrdíte formulář<\/b><p>Číslo objednávky a e-mail stačí.<\/p><\/div><\/li>\n    <li><div><b>Pošlete zboží zpět<\/b><p>Adresu skladu v Česku najdete v potvrzení. [[Kdo platí dopravu zpět, určí obchodní podmínky.]]<\/p><\/div><\/li>\n    <li><div><b>Vrátíme peníze<\/b><p>Do 14 dnů od odstoupení, stejným způsobem, jakým jste platili.<\/p><\/div><\/li>\n  <\/ol><\/div>\n  <div>{{form:withdraw}}<\/div>\n<\/div><\/section>"},"obchodni-podminky":{"title":"Obchodní podmínky","crumb":null,"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"legal_page\"><h1>Obchodní podmínky<\/h1><p class=\"lead\">Text dodá klient v polštině po kontrole právníkem. Obchod ho zobrazí beze změn.<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap prose\"><h2 style=\"margin-top:0\">Co má dokument obsahovat<\/h2><ul><li>Provozovatel a kontakty<\/li><li>Objednávka a uzavření smlouvy, tlačítko s povinností platby<\/li><li>Ceny, doprava, platby, faktura<\/li><li>Odstoupení od smlouvy a formulář<\/li><li>Zákonná záruka a reklamace<\/li><li>Ověřování recenzí<\/li><li>Informace o přístupnosti obchodu<\/li><li>Rozhodné právo<\/li><\/ul><p class=\"tbd-b\">Místo pro text od klienta<\/p><\/div><\/section>"},"reklamacni-rad":{"title":"Reklamační řád","crumb":null,"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"legal_page\"><h1>Reklamační řád<\/h1><p class=\"lead\">Text dodá klient v polštině po kontrole právníkem. Obchod ho zobrazí beze změn.<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap prose\"><h2 style=\"margin-top:0\">Co má dokument obsahovat<\/h2><ul><li>Kde a jak reklamovat, sériové číslo REVCR<\/li><li>Lhůty pro vyřízení<\/li><li>Doprava do servisu v Česku<\/li><li>Digitální funkce (SolarSync, ChargeSafe, Offgrid)<\/li><\/ul><p class=\"tbd-b\">Místo pro text od klienta<\/p><\/div><\/section>"},"ochrana-osobnich-udaju":{"title":"Ochrana osobních údajů","crumb":null,"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"legal_page\"><h1>Ochrana osobních údajů<\/h1><p class=\"lead\">Text dodá klient v polštině po kontrole právníkem. Obchod ho zobrazí beze změn.<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap prose\"><h2 style=\"margin-top:0\">Co má dokument obsahovat<\/h2><ul><li>Správce údajů<\/li><li>Údaje z objednávky, předávání do systému výrobce a dopravcům<\/li><li>Chatbot a záznamy konverzací<\/li><li>Práva zákazníka<\/li><\/ul><p class=\"tbd-b\">Místo pro text od klienta<\/p><\/div><\/section>"},"cookies":{"title":"Cookies","crumb":null,"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"legal_page\"><h1>Cookies<\/h1><p class=\"lead\">Text dodá klient v polštině po kontrole právníkem. Obchod ho zobrazí beze změn.<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap prose\"><h2 style=\"margin-top:0\">Co má dokument obsahovat<\/h2><ul><li>Nezbytné cookies<\/li><li>Analytické a marketingové cookies<\/li><li>Chatbot<\/li><li>Jak souhlas změnit<\/li><\/ul><p class=\"tbd-b\">Místo pro text od klienta<\/p><\/div><\/section>"},"zpetny-odber":{"title":"Zpětný odběr elektrozařízení","crumb":["Podpora","#/podpora"],"html":"<section class=\"pghead\"><div class=\"wrap\" data-note=\"weee_page\"><h1>Zpětný odběr elektrozařízení<\/h1><p class=\"lead\">Wallbox ani jeho adaptéry nepatří do směsného odpadu. Když kupujete nový wallbox, starý spotřebič stejného druhu si od vás vezmeme zdarma.<\/p><\/div><\/section>\n<section class=\"sec tight\"><div class=\"wrap cols\">\n  <div class=\"prose\"><h2 style=\"margin-top:0\">Jak předat starý spotřebič<\/h2><p>[[Postup při doručení kurýrem a do Paczkomatu doplní klient.]]<\/p><p>Vysloužilé zařízení můžete odevzdat i na sběrném místě ve vaší obci. [[Odkaz na seznam sběrných míst.]]<\/p><\/div>\n  <div class=\"prose\"><h2 style=\"margin-top:0\">Údaje o registraci<\/h2><p>Číslo v rejstříku BDO: [[číslo autorizovaného zástupce v Polsku]]<\/p><p class=\"small\">Symbol přeškrtnuté popelnice na výrobku znamená, že patří do odděleného sběru.<\/p><\/div>\n<\/div><\/section>"}},"analysis":"<div class=\"dwrap\">\n<p class=\"meta\">maveiro.pl · UX analýza k wireframu · mime digital · 31. 10. 2026<\/p>\n<h1>UX analýza e-shopu maveiro.pl<\/h1>\n<p>Podklad ke <a href=\"#/\">klikacímu wireframu<\/a>. Vychází ze zadávací dokumentace z 29. 10. 2026, z workshopu 3. 6., z komentářů Tomáše Richtra k obsahovému návrhu 7. 10., z cenové analýzy pro Polsko, z produktových dat a návodů výrobce a z rešerše konkurence, výzkumů a legislativy k 31. 10. 2026. Zdroje jsou v kapitole 8.<\/p>\n<div class=\"callout\"><p><b>Jedna otázka pro tuto fázi:<\/b> souhlasíte se strukturou obchodu a s tím, jak konfigurátor provede zákazníka od výběru po objednávku? Na ní stojí grafický návrh. Rozhodnutí níže potřebujeme dřív, než grafik začne.<\/p><\/div>\n\n<ol class=\"toc\">\n<li><a href=\"#/analyza\" data-a=\"a0\">Rozhodnutí pro klienta<\/a><\/li>\n<li><a href=\"#/analyza\" data-a=\"a1\">Shrnutí<\/a><\/li>\n<li><a href=\"#/analyza\" data-a=\"a2\">Pro koho navrhujeme<\/a><\/li>\n<li><a href=\"#/analyza\" data-a=\"a3\">Konkurence v Polsku<\/a><\/li>\n<li><a href=\"#/analyza\" data-a=\"a4\">Klíčová rozhodnutí v návrhu<\/a><\/li>\n<li><a href=\"#/analyza\" data-a=\"a5\">Stránky a rozsah<\/a><\/li>\n<li><a href=\"#/analyza\" data-a=\"a6\">Co doplnit do zadávací dokumentace<\/a><\/li>\n<li><a href=\"#/analyza\" data-a=\"a7\">Rozpory v podkladech výrobce<\/a><\/li>\n<li><a href=\"#/analyza\" data-a=\"a9\">Zdroje<\/a><\/li>\n<\/ol>\n\n<h2 id=\"a0\">Rozhodnutí pro klienta<\/h2>\n<table>\n<thead><tr><th>Rozhodnutí<\/th><th>Doporučení mime<\/th><th>Kdo<\/th><th>Do kdy<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Platby BLIK a Przelewy24<\/td><td>Zapnout, BLIK jako první metodu<\/td><td>Tomáš Richtr<\/td><td>[[13. 11. 2026]]<\/td><\/tr>\n<tr><td>Sleva za převod<\/td><td>Zrušit, nebo řešit aplikací v košíku (PaySelect, BTD nebo HidePay, 3,99 až 4,99 USD měsíčně). Převod v Polsku používá 10 % lidí.<\/td><td>Tomáš Richtr<\/td><td>[[13. 11. 2026]]<\/td><\/tr>\n<tr><td>Doprava a její cena<\/td><td>Paczkomat InPost jako výchozí (aplikace Globe, tarif Advanced 15 USD měsíčně, výběr v košíku), kurýr jako druhá možnost, u wallboxů doprava zdarma<\/td><td>Tomáš Richtr<\/td><td>[[13. 11. 2026]]<\/td><\/tr>\n<tr><td>Chatbot po 10 sekundách<\/td><td>Jen malá bublina, ne na mobilu, v košíku a pokladně, ověřit testem<\/td><td>Tomáš Richtr<\/td><td>[[13. 11. 2026]]<\/td><\/tr>\n<tr><td>Názvy řad a nabídka po příchodu Lite (Wi-Fi v základu, placené OCPP, tarify)<\/td><td>Potvrdit před grafickým návrhem<\/td><td>Tomáš Richtr<\/td><td>[[13. 11. 2026]]<\/td><\/tr>\n<tr><td>Údaje výrobce z kapitoly 7 (krytí, OCPP, TÜV, cena funkcí FVE, sada Plus, RFID)<\/td><td>Sjednotit dřív, než se přenesou produktová data<\/td><td>Tomáš Richtr<\/td><td>[[20. 11. 2026]]<\/td><\/tr>\n<tr><td>Právní body z kapitoly 6<\/td><td>Posoudit právníkem klienta, hlavně rozhodné právo obchodních podmínek<\/td><td>Tomáš Richtr a právník<\/td><td>před spuštěním<\/td><\/tr>\n<\/tbody><\/table>\n<p><b>Další krok:<\/b> Michal Mervart a Miroslav Budiš projdou wireframe [[do 7. 11.]], Dana Nizri ho pošle ke schválení v Caflou, po rozhodnutí výše začne grafický návrh.<\/p>\n\n<h2 id=\"a1\">1. Shrnutí<\/h2>\n<ul>\n<li><b>Konfigurátor je hlavní prodejní nástroj.<\/b> V Polsku ho s cenou příplatku v zł nemá nikdo z konkurentů. Volby jsou vidět jako tlačítka s příplatkem, výchozí je vždy varianta bez příplatku a souhrn Vaše sestava se přepočítá po každé volbě.<\/li>\n<li><b>Nabíjení z přebytků FVE a otevřené napojení mají vlastní blok, stránku a závislou volbu v konfigurátoru.<\/b> Klient je označil za největší trhák, Loxone ani Shelly nezmiňuje žádný konkurent.<\/li>\n<li><b>Košík je potřeba navrhnout, ne převzít ze šablony.<\/b> Na tarifu Grow se v něm vybírá Paczkomat, zapíná sleva za převod, dává souhlas s aktivací funkcí a ukazuje harmonizované oznámení o záruce. Do pokladny Shopify na Grow nic z toho přidat nejde.<\/li>\n<li><b>Platby podle Poláků:<\/b> BLIK a Przelewy24 na prvních místech. BLIK používá 67 % lidí, převod 10 %. V zadání BLIK chybí.<\/li>\n<li><b>Chatbot jako bublina, ne vyskakovací okno.<\/b> Výzkum je proti automatickému otevření, kompromis drží požadavek klienta a nepřekáží nákupu.<\/li>\n<li><b>Šest povinností, které v zadání chybí:<\/b> blok výrobce podle GPSR, text tlačítka objednávky, funkce odstoupení online, zpětný odběr elektrozařízení, Omnibus u slev a upřesnění termínu harmonizovaného oznámení.<\/li>\n<\/ul>\n\n<h2 id=\"a2\">2. Pro koho navrhujeme<\/h2>\n<p><b>Majitel elektromobilu, 35 až 55 let<\/b>, nový i ojetý elektromobil zhruba napůl. Často neví, co koupit, a čeká na radu. Řeší bezpečnost: proudový chránič, venkovní použití, přehřátí zásuvky. Nákupní motivace v pořadí: funkce a aplikace, FVE a otevřenost (Loxone, Shelly, Modbus), certifikace. Zdroj: workshop 3. 6. 2026.<\/p>\n<p><b>Majitel FVE<\/b>, který chce nabíjet z přebytků a mít nabíjení pod kontrolou v aplikaci, často i v Home Assistant.<\/p>\n<p><b>Montážní firmy a prodejci<\/b> v Polsku. Maveiro instalaci v Polsku nenabízí, montážní firmy doporučí zákazníkům, kteří ji potřebují.<\/p>\n<h3>Polský nakupující v číslech<\/h3>\n<table>\n<thead><tr><th>Co<\/th><th>Údaj<\/th><th>Co z toho plyne<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Nákup dokončený na telefonu<\/td><td>58 %<\/td><td>Konfigurátor a lepivá lišta navrženy nejdřív pro mobil.<\/td><\/tr>\n<tr><td>BLIK, používá / nejčastější<\/td><td>67 % / 53 %<\/td><td>BLIK první v pokladně.<\/td><\/tr>\n<tr><td>Rychlý převod (pay-by-link)<\/td><td>27 %<\/td><td>Przelewy24 jako druhá metoda.<\/td><\/tr>\n<tr><td>Klasický převod<\/td><td>10 %<\/td><td>Sleva za převod osloví menšinu.<\/td><\/tr>\n<tr><td>Výdejní automaty, z toho InPost<\/td><td>84 %, 82 %<\/td><td>Paczkomat jako výchozí doprava, výběr v košíku.<\/td><\/tr>\n<tr><td>Doprava zdarma důležitá<\/td><td>88 %<\/td><td>Doprava zdarma u wallboxů.<\/td><\/tr>\n<tr><td>Odchod kvůli vyskakovacím oknům<\/td><td>26 %<\/td><td>Chatbot bez vyskočení přes obsah.<\/td><\/tr>\n<\/tbody><\/table>\n<p class=\"src\">Gemius, PBI, IAB Polska: E-commerce w Polsce 2026, vydáno 30. 9. 2026, N = 1 874.<\/p>\n\n<h2 id=\"a3\">3. Konkurence v Polsku<\/h2>\n<p>Konkurenti podle cenové analýzy z 20. 10. 2026. Benchmark detailu produktu, důvěry a nákupu v polštině proběhl 31. 10. 2026.<\/p>\n<table>\n<thead><tr><th><\/th><th>Volby a cena<\/th><th>Adaptéry<\/th><th>FVE na detailu<\/th><th>Polský nákup<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Green Cell Habu<\/td><td>Bez voleb<\/td><td>Nevysvětlené, zákazník kupoval 230 V zvlášť<\/td><td>Ne<\/td><td>Polsky, kurýr, karta, +48<\/td><\/tr>\n<tr><td>go-e Gemini flex<\/td><td>Na PL webu žádné<\/td><td>CEE v ceně, ostatní volitelně<\/td><td>Samostatná sekce<\/td><td>Polský web bez nákupu<\/td><\/tr>\n<tr><td>Juice Booster 3 air<\/td><td>Sady jako samostatné produkty<\/td><td>Jen v popiscích obrázků<\/td><td>Ne<\/td><td>Bez polštiny<\/td><\/tr>\n<tr><td>NRGkick<\/td><td>Konfigurátor, příplatky bez DPH<\/td><td>Karty s výkonem a upozorněním<\/td><td>Placená volba<\/td><td>Bez polštiny<\/td><\/tr>\n<tr><td>evrepair.pl<\/td><td>Bez voleb<\/td><td>Samostatná kategorie<\/td><td>Ne<\/td><td>BLIK, Przelewy24, Paczkomaty, +48<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Co z toho plyne<\/h3>\n<ol>\n<li>Konfigurátor s příplatkem v zł s DPH a živou cenou nemá nikdo. To je náskok.<\/li>\n<li>Adaptéry vysvětlit podle zásuvky a upozornit, když v sadě žádný není (dělá to jen NRGkick).<\/li>\n<li>FVE a napojení na další systémy jsou hlavní prostor pro odlišení, Loxone ani Shelly nikdo neuvádí.<\/li>\n<li>Polský blok důvěry pod tlačítkem: Paczkomat, BLIK, vrácení, doručení. Má ho jen evrepair.<\/li>\n<li>Polské telefonní číslo má z prověřených konkurentů jen evrepair a Green Cell.<\/li>\n<li>Rodilá polština. Strojové překlady z češtiny jsou na polském trhu vidět na první pohled (Wpisz 2 místo Typ 2).<\/li>\n<li>FAQ přímo na detailu nemá nikdo z prověřených.<\/li>\n<\/ol>\n\n<h2 id=\"a4\">4. Klíčová rozhodnutí v návrhu<\/h2>\n<h3>Jeden detail produktu místo osmi<\/h3>\n<p>Na českém e-shopu výrobce je každá kombinace řady, sady a výkonu samostatný produkt. Na Shopify doporučujeme jeden produkt na řadu: výkon a sada jako skutečné varianty se skladem a SKU pro CRM, ostatní volby jako příplatky přes aplikaci. Zákazník porovná sady na jedné stránce a vyhledávač nevidí osm podobných stránek.<\/p>\n<h3>Volby předvybrané bez příplatku<\/h3>\n<p>Český e-shop má šest povinných polí bez předvolby. Doporučujeme předvybrat základ (Bluetooth, základní měření, 6,5 m, bez Tesla tlačítka). Cena od pak sedí s cenou v košíku a zákazník mění jen to, co chce. Barva konektoru a příspěvek NF Krtek v Polsku nejsou.<\/p>\n<h3>Funkce pro FVE závisí na Wi-Fi<\/h3>\n<p>SolarSync, ChargeSafe a Offgrid fungují jen s Wi-Fi ve stejné síti jako střídač, LTE nestačí. S Bluetooth je proto volba neaktivní s vysvětlením a tlačítkem Přidat Wi-Fi. Zákazník tak nekoupí funkci, kterou nemůže použít. LTE se navíc nedá dokoupit později, proto to konfigurátor říká přímo u volby. Aplikace pro příplatky musí umět podmíněnou logiku, všechny tři z užšího výběru ji mají.<\/p>\n<h3>Adaptéry podle zásuvky<\/h3>\n<p>U sady Charger upozornění, že je bez adaptérů. Pod volbami seznam adaptérů navíc, které se přidají do košíku jako samostatné produkty se skladem. Inspirace: blok Potřebujete více koncovek? v konfigurátoru výrobce a upozornění u NRGkick.<\/p>\n<h3>Vaše sestava a lepivá lišta<\/h3>\n<p>Souhrn konfigurace je jádro návrhu: každá volba je řádek s cenou, celková cena se přepočítá okamžitě, stejné řádky jsou v košíku, potvrzení i v objednávce pro CRM. Na mobilu po odscrollování lepivá lišta s cenou sestavy a tlačítkem.<\/p>\n<h3>Košík jako samostatný krok<\/h3>\n<p>Vysouvací košík potvrdí vložení a vede do košíku, ne rovnou do pokladny. Tam zákazník vybere Paczkomat (aplikace Globe na Grow jinak neumí), případně zapne slevu za převod, potvrdí okamžitou aktivaci funkcí pro FVE a uvidí celé harmonizované oznámení o záruce. Bez vybraného automatu nejde pokračovat.<\/p>\n<h3>Chatbot bez vyskakování<\/h3>\n<p>Zadání chce vyskočení po 10 s. Baymard automatické otevírání chatu nedoporučuje a 26 % Poláků mění obchod kvůli vyskakovacím oknům. Doporučení: po 10 s jen malá bublina bez překrytí obsahu, ne na mobilu, v košíku ani v pokladně, po zavření se neukáže znovu. Okno chatu je označené jako AI asistent. Ověřit testem.<\/p>\n<h3>Bez doporučovacího nástroje<\/h3>\n<p>Klient nástroj Jak vybrat nechce. Rozhodování podporuje srovnávací tabulka řad v kategorii, tabulka doby nabíjení na detailu a technická podpora v chatu, po telefonu a e-mailem.<\/p>\n<h3>Pojmy a vyhledávání<\/h3>\n<p>Terminologie klienta platí: přenosný wallbox, elektromobil, nástěnný wallbox. V polštině se ale przenośny wallbox hledá 10× měsíčně, mobilna ładowarka 210× a ładowarka EV 3 600×. Doporučení: nadpisy podle klienta, titulky a popisy pro vyhledávače s výrazy, které Poláci hledají.<\/p>\n\n<h2 id=\"a5\">5. Stránky a rozsah<\/h2>\n<table>\n<thead><tr><th>Stránka<\/th><th>Rozsah podle objednávky<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Domů, kategorie, detail produktu<\/td><td>Wireframe a unikátní grafický design, mobil i desktop<\/td><\/tr>\n<tr><td>Kontakt, O nás<\/td><td>Unikátní grafický design<\/td><\/tr>\n<tr><td>Košík, Staňte se partnerem, Podpora, Doprava a platba, Zákonná záruka, právní stránky<\/td><td>Šablona Shopify. Košík doporučujeme upravit (Paczkomat, sleva za převod, souhlas, oznámení).<\/td><\/tr>\n<tr><td>Pokladna, děkovací stránka, účet<\/td><td>Nativní Shopify, jen logo, barvy a texty<\/td><\/tr>\n<tr><td>Nabíjení z FVE, Odstoupení od smlouvy, Zpětný odběr elektrozařízení<\/td><td>Doplněno ve wireframu, mimo objednávku. Ze šablony.<\/td><\/tr>\n<\/tbody><\/table>\n<p>Texty stránek mimo pět navržených jsou ve wireframu ilustrační. Jejich finální znění je podle zadávací dokumentace (kap. 5) vícepráce. Hlídání dostupnosti, odpovědi z FAQ ve vyhledávání, odhad dne doručení a mapa partnerů potřebují aplikaci nebo vývoj navíc, v poznámkách jsou označené.<\/p>\n<h3>Tři cesty, které wireframe prověřuje<\/h3>\n<ol>\n<li><b>Chci nabíjet doma v garáži.<\/b> Domů, Přenosné wallboxy, srovnání řad, Maveiro II nebo PRO II, sestava, košík, Paczkomat, pokladna s BLIKem.<\/li>\n<li><b>Mám FVE.<\/b> Domů, blok FVE, stránka Nabíjení z FVE, PRO II s Wi-Fi a funkcemi pro FVE, dotaz technické podpoře v chatu.<\/li>\n<li><b>Jsem montážní firma.<\/b> Servisní lišta, Staňte se partnerem, formulář s NIP a vojvodstvím.<\/li>\n<\/ol>\n\n<h2 id=\"a6\">6. Co doplnit do zadávací dokumentace<\/h2>\n<table>\n<thead><tr><th>Bod<\/th><th>Proč<\/th><th>Doporučení<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>BLIK a Przelewy24 (3.2.1)<\/td><td>Hlavní platby v Polsku, přes Shopify Payments jdou i pro českou firmu<\/td><td>Zapnout. Przelewy24 schvaluje poskytovatel týdny, potřebuje zveřejněné podmínky vrácení a ochrany údajů.<\/td><\/tr>\n<tr><td>Sleva za převod (3.2.1)<\/td><td>Shopify ji nativně neumí<\/td><td>Aplikace s přepínačem v košíku, nebo slevu zrušit<\/td><\/tr>\n<tr><td>Výběr Paczkomatu (3.2.2)<\/td><td>Na Grow s Globe jen v košíku nebo po objednávce<\/td><td>Košík navrhnout, ne převzít ze šablony. Ověřit, že se balení vejde do schránky.<\/td><\/tr>\n<tr><td>Harmonizované oznámení (3.4.1)<\/td><td>V Polsku účinné od 27. 9. 2027 (zadání uvádí 2026), text dodává Komise a nesmí se upravit<\/td><td>Ukazovat celé v košíku od spuštění, termín podle rozhodného práva posoudí právník<\/td><\/tr>\n<tr><td>Funkce odstoupení online<\/td><td>Směrnice (EU) 2023/2673; v Česku od 1. 1. 2027 podle sekundárních zdrojů, v Polsku v návrhu zákona<\/td><td>Formulář s potvrzením, odkaz v patičce, v účtu a na stránce stavu objednávky<\/td><\/tr>\n<tr><td>Souhlas s okamžitou aktivací funkcí pro FVE<\/td><td>Digitální obsah: bez výslovného souhlasu zůstává právo na odstoupení<\/td><td>Zaškrtávátko v košíku, text a povinnost určí právník<\/td><\/tr>\n<tr><td>Blok výrobce GPSR<\/td><td>Nařízení (EU) 2023/988, čl. 19, platí i pro wallboxy<\/td><td>Na každém detailu výrobce, adresa, označení, bezpečnostní informace polsky<\/td><\/tr>\n<tr><td>Tlačítko objednávky<\/td><td>Polský zákon vyžaduje zamówienie z obowiązkiem zapłaty<\/td><td>Upravit texty pokladny<\/td><\/tr>\n<tr><td>Elektroodpad<\/td><td>Autorizovaný zástupce v Polsku, BDO na fakturách z CRM, bezplatný odběr starého spotřebiče<\/td><td>Stránka o zpětném odběru, informace na děkovací stránce<\/td><\/tr>\n<tr><td>Omnibus<\/td><td>Při slevě nejnižší cena za 30 dní<\/td><td>Aplikace, pokud budou slevy<\/td><\/tr>\n<tr><td>Recenze z Česka (3.1.2)<\/td><td>Úprava názvu produktu v převzatých recenzích může být podle polského práva zkreslení recenzí<\/td><td>Právní posouzení před převodem, citace doslovně, informace o ověřování recenzí<\/td><\/tr>\n<tr><td>FAQ (3.1.3)<\/td><td>Google FAQ ve výsledcích od 7. 5. 2026 nezobrazuje<\/td><td>FAQ ponechat pro zákazníky a AI vyhledávače, upravit zdůvodnění<\/td><\/tr>\n<tr><td>Chatbot (3.1.5)<\/td><td>Výzkum proti vyskakování; AI Act čl. 50, podle sekundárních zdrojů od 2. 8. 2026; souhlas s cookies<\/td><td>Bublina místo okna, označení AI, načíst po souhlasu<\/td><\/tr>\n<tr><td>Přístupnost<\/td><td>Evropský akt o přístupnosti, pokud R-EVC není mikropodnik<\/td><td>Cíl WCAG 2.2 AA, informace v obchodních podmínkách<\/td><\/tr>\n<tr><td>Polština všude<\/td><td>Zákon o polském jazyce platí i pro texty aplikací, e-maily a faktury<\/td><td>Rodilá korektura před spuštěním<\/td><\/tr>\n<\/tbody><\/table>\n<p class=\"src\">Nejde o právní stanovisko. Rozhodné právo obchodních podmínek (české, nebo polské) mění termíny povinností, posoudí právník klienta.<\/p>\n\n<h2 id=\"a7\">7. Rozpory v podkladech výrobce<\/h2>\n<p>Před přenosem dat na maveiro.pl je potřeba sjednotit:<\/p>\n<ul>\n<li>Krytí přenosného wallboxu: e-shop IP67 a IP65, návod IP54.<\/li>\n<li>OCPP: e-shop 2.0, návod a dokumentace 1.6J. Podle komentáře klienta bude OCPP placená funkce.<\/li>\n<li>TÜV: na webu je inspekční certifikát jednoho kusu 3 × 16 A z roku 2023. EU prohlášení o shodě přenosného wallboxu je ve stavu připravujeme.<\/li>\n<li>Cena funkcí pro FVE: zdroje výrobce uvádějí tři různé částky. Názvy režimů Standard a Off.<\/li>\n<li>Obsah sady Plus: popis produktu a obrázek rozdílů mezi verzemi se liší.<\/li>\n<li>Hmotnost a rozměry přenosného wallboxu: e-shop 4,6 kg a 24,5 × 9,1 × 15 cm, návod čistá hmotnost 2,8 kg a 245 × 91 × 47 mm.<\/li>\n<li>Provozní teplota nástěnného wallboxu: e-shop −30 až +85 °C, návod a prohlášení o shodě −25 až +45 °C.<\/li>\n<li>RFID u nástěnného wallboxu: čtečka je v ceně, autorizace kartou zatím není dostupná.<\/li>\n<li>Prodlužovací kabel: e-shop zachovává bezpečnostní funkce, návod uvádí vliv na záruku.<\/li>\n<li>Poplatek za data LTE po třech letech je uvedený třikrát jinak.<\/li>\n<li>Na webech jsou čtyři telefonní čísla a čtyři e-maily.<\/li>\n<\/ul>\n\n<h2 id=\"a9\">8. Zdroje<\/h2>\n<ul class=\"src\">\n<li>Zadávací dokumentace maveiro.pl, 29. 10. 2026; cenová analýza PL, 20. 10. 2026; komentáře klienta, 7. 10. 2026; zápis z workshopu, 3. 6. 2026.<\/li>\n<li>Český e-shop a konfigurátor výrobce, zákaznický portál, návody k přenosnému a nástěnnému wallboxu, ARES, staženo 31. 10. 2026.<\/li>\n<li>Gemius, PBI, IAB Polska: E-commerce w Polsce 2026.<\/li>\n<li>Baymard Institute: Product Page UX 2026, 35 e-commerce UX best practices (6/2026), Product spec sheet (9/2026), Cart abandonment rate (9/2025), User perception of product ratings.<\/li>\n<li>Nielsen Norman Group: Comparison tables (2/2024), Menu-Design Checklist (6/2024), Language switching in e-commerce (3/2022), Popups (2019).<\/li>\n<li>Google Search Central: FAQPage change
